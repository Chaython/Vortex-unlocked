name: Build Vortex Unlocked

# Vortex Unlocked CI
# ------------------
# Builds upstream Vortex with patches/vortex-unlocked.patch applied on top, then
# packages an unsigned Windows installer and publishes it as a release.
#
# Two jobs:
#   plan  (ubuntu, ~1 min)  clones upstream, decides WHAT to build and whether
#                           to build at all, and produces one "resolved" patch
#                           that applies EXACTLY to the chosen upstream commit.
#   build (windows)         only runs when plan says so; applies the resolved
#                           patch with a plain `git apply` and builds.
#
# What plan builds:
#   1. Latest upstream HEAD, if the patch applies to it (git apply --3way with
#      no leftover conflicts).
#   2. Otherwise the commit pinned in .upstream-base - the upstream commit the
#      patch is known to apply to - so a release still ships. An issue titled
#      "Patch needs rebase onto upstream Vortex" is opened/updated with the
#      conflicting files, and closed again automatically once HEAD applies.
#
# There is no hand-written conflict "rebasing" in this file any more. When
# upstream drifts, rebase the patch with scripts/rebase-patch.sh, which
# rewrites patches/vortex-unlocked.patch and .upstream-base together.
#
# Triggers:
#   - push that changes the patch, .upstream-base or this workflow (always builds)
#   - daily schedule (skipped when the commit it would build was already released)
#   - manual dispatch (always builds)
#
# NOTE: every `uses:` reference must be a version that actually exists.
# ncipollo/release-action only publishes v1 tags (v2 does NOT exist).

on:
  push:
    branches: [master, main]
    paths:
      - "patches/**"
      - ".upstream-base"
      - ".github/workflows/build-vortex-unlocked.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A newer push supersedes an older in-flight push build. A scheduled run never
# cancels a build that is already running (it just waits its turn).
concurrency:
  group: vortex-unlocked-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  UPSTREAM_URL: https://github.com/Nexus-Mods/Vortex.git

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      mode: ${{ steps.prepare.outputs.mode }}
      target: ${{ steps.prepare.outputs.target }}
      short: ${{ steps.prepare.outputs.short }}
      date: ${{ steps.prepare.outputs.date }}
    steps:
      - name: Checkout patch repository (patch + pinned base only)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /.upstream-base
            /patches/
          sparse-checkout-cone-mode: false

      - name: Resolve upstream commit and apply patch
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global advice.detachedHead false

          fail() { echo "::error::$1"; exit 1; }

          [ -f patches/vortex-unlocked.patch ] || fail "patches/vortex-unlocked.patch is missing from the repository."
          [ -f .upstream-base ] || fail ".upstream-base is missing from the repository."

          PINNED="$(tr -d '[:space:]' < .upstream-base)"
          [[ "$PINNED" =~ ^[0-9a-f]{40}$ ]] || fail ".upstream-base must contain one full 40-character upstream commit SHA (got: '$PINNED')."

          mkdir -p plan
          cp patches/vortex-unlocked.patch plan/in.patch
          # Safety net: some upload paths mangle the patch with CRLF or a BOM,
          # both of which make `git apply` fail.
          if [[ "$(head -n1 plan/in.patch)" == *$'\r' ]]; then
            echo "::warning::Patch file had CRLF line endings - normalizing to LF."
            sed -i 's/\r$//' plan/in.patch
          fi
          sed -i '1s/^\xEF\xBB\xBF//' plan/in.patch

          # Cheap syntax preflight: catches corrupt/truncated hunks.
          git apply --numstat plan/in.patch > /dev/null || fail "Patch syntax validation failed."

          # Full clone on purpose: --3way needs the historical blobs the patch
          # was written against.
          git clone --no-tags -q "$UPSTREAM_URL" vortex
          cd vortex
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Upstream HEAD: $HEAD_SHA"
          echo "Pinned base:   $PINNED"

          MODE=latest
          TARGET="$HEAD_SHA"
          FAILED=""

          git checkout -q --detach "$HEAD_SHA"
          set +e
          git apply --3way --whitespace=nowarn ../plan/in.patch > ../plan/apply-head.log 2>&1
          RC=$?
          set -e
          UNMERGED="$(git ls-files -u | cut -f2 | sort -u || true)"

          if [ "$RC" -ne 0 ] || [ -n "$UNMERGED" ]; then
            FAILED="$( { printf '%s\n' "$UNMERGED"; sed -n 's/^error: patch failed: \([^:]*\):.*/\1/p' ../plan/apply-head.log; } | sed '/^$/d' | sort -u )"
            echo "::warning::Patch does not apply to upstream HEAD ${HEAD_SHA:0:9}; falling back to pinned base ${PINNED:0:9}."
            echo "Files that need a rebase:"
            printf '%s\n' "$FAILED" | while IFS= read -r f; do echo "  $f"; done
            git reset -q --hard
            git clean -fdxq
            git cat-file -e "$PINNED^{commit}" 2>/dev/null || fail "Pinned base $PINNED is not in the upstream history, and the patch does not apply to HEAD. Rebase the patch (scripts/rebase-patch.sh)."
            MODE=pinned
            TARGET="$PINNED"
            git checkout -q --detach "$PINNED"
            git apply --index --whitespace=nowarn ../plan/in.patch || fail "Patch does not apply to its own pinned base ${PINNED:0:9}. Regenerate it with scripts/rebase-patch.sh."
          fi
          echo "Mode: $MODE, building ${TARGET:0:9}"

          # One resolved patch that applies EXACTLY to $TARGET: the build job
          # needs no merge logic, and what gets built is what was tested here.
          git add -A
          git diff --cached --binary --full-index "$TARGET" > ../plan/resolved.patch
          [ -s ../plan/resolved.patch ] || fail "Resolved patch is empty."
          git reset -q --hard "$TARGET"
          git clean -fdxq
          git apply --check ../plan/resolved.patch || fail "Resolved patch failed its round-trip check."
          cd ..

          SHORT="${TARGET:0:7}"
          DATE="$(date -u +%Y%m%d)"

          # Only the daily schedule skips; a push or manual run always builds.
          SKIP=false
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
            echo "Latest release tag: '${LATEST}'"
            if [[ -n "$LATEST" && "$LATEST" == *".$SHORT" ]]; then
              SKIP=true
              echo "Release $LATEST was already built from upstream $SHORT - nothing to do."
            fi
          fi

          {
            echo "skip=$SKIP"
            echo "mode=$MODE"
            echo "target=$TARGET"
            echo "short=$SHORT"
            echo "date=$DATE"
          } >> "$GITHUB_OUTPUT"

          # Body for the "needs rebase" issue (used by the next step). The
          # backticks below are literal Markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            printf '%s\n\n' 'The latest upstream Vortex no longer accepts patches/vortex-unlocked.patch, so the build fell back to the pinned base commit. Releases keep shipping, but they are stuck on the old upstream commit until the patch is rebased.'
            printf -- '- Upstream HEAD: `%s`\n' "${HEAD_SHA:0:9}"
            printf -- '- Built instead (pinned in `.upstream-base`): `%s`\n' "${PINNED:0:9}"
            printf -- '- Run: %s/%s/actions/runs/%s\n\n' "${GITHUB_SERVER_URL:-https://github.com}" "${GITHUB_REPOSITORY:-}" "${GITHUB_RUN_ID:-}"
            printf '%s\n\n' '**Files that need attention**'
            printf '%s\n' "$FAILED" | while IFS= read -r f; do printf -- '- `%s`\n' "$f"; done
            printf '\n%s\n\n' '**How to rebase**'
            printf '%s\n' '```sh'
            printf '%s\n' 'bash scripts/rebase-patch.sh       # clones upstream, applies the patch with --3way'
            printf '%s\n' '# resolve any conflict markers inside ./vortex-rebase, then:'
            printf '%s\n' 'bash scripts/rebase-patch.sh --finish # rewrites patches/vortex-unlocked.patch and .upstream-base'
            printf '%s\n' '```'
            printf '\n%s\n\n' 'Commit both files. This issue closes itself once the patch applies to upstream HEAD again.'
            printf '%s\n\n' '<details><summary>git apply --3way output</summary>'
            printf '%s\n' '```'
            { grep -vE '^Applied patch .* cleanly\.$|^Falling back to direct application|^Checking patch |^Performing three-way merge' plan/apply-head.log || true; } | tail -n 40
            printf '%s\n' '```'
            printf '%s\n' '</details>'
          } > plan/issue-body.md

      - name: Track patch rebase status in an issue
        if: steps.prepare.outputs.mode != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ steps.prepare.outputs.mode }}
        run: |
          set -euo pipefail
          TITLE="Patch needs rebase onto upstream Vortex"
          NUM="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ "$MODE" = "pinned" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file plan/issue-body.md
              echo "Updated issue #$NUM"
            else
              gh issue create --title "$TITLE" --body-file plan/issue-body.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "The patch applies to upstream HEAD again - closing."
          fi

      - name: Upload resolved patch
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-patch
          path: plan/resolved.patch
          retention-days: 3
          if-no-files-found: error

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      NO_PARALLEL: "true"
      DEBUG: electron-builder
      UPSTREAM_SHA: ${{ needs.plan.outputs.short }}
      BUILD_DATE: ${{ needs.plan.outputs.date }}

    steps:
      - name: Checkout repository context (.upstream-base only)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /.upstream-base
          sparse-checkout-cone-mode: false

      - name: Download resolved patch
        uses: actions/download-artifact@v4
        with:
          name: resolved-patch
          path: resolved-patch

      - name: Clone upstream Vortex at the planned commit and apply patch
        shell: bash
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global advice.detachedHead false
          git clone --no-tags -q "$UPSTREAM_URL" vortex
          cd vortex
          git checkout -q --detach "$TARGET"
          git apply --index --whitespace=nowarn ../resolved-patch/resolved.patch
          echo "Building upstream commit ${TARGET:0:9} ($MODE) on $BUILD_DATE"

      - name: Read toolchain versions from upstream package.json
        id: toolchain
        shell: pwsh
        run: |
          $packageJson = Get-Content vortex/package.json | ConvertFrom-Json
          $nodeVersion = $packageJson.engines.node
          $pnpmVersion = ""
          if ("$($packageJson.packageManager)" -match '^pnpm@([0-9]+\.[0-9]+\.[0-9]+)') { $pnpmVersion = $Matches[1] }
          echo "NODE_VERSION=$nodeVersion" >> $env:GITHUB_OUTPUT
          echo "PNPM_VERSION=$pnpmVersion" >> $env:GITHUB_OUTPUT
          echo "Using Node.js $nodeVersion, pnpm $pnpmVersion"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.PNPM_VERSION || '11' }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: vortex/pnpm-lock.yaml

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Derive build version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content vortex\package.json | ConvertFrom-Json
          $rawVersion = "$($pkg.version)-unlocked.$env:BUILD_DATE.$env:UPSTREAM_SHA"
          echo "RAW_VERSION=$rawVersion" >> $env:GITHUB_OUTPUT
          echo "TAG_VERSION=v$rawVersion" >> $env:GITHUB_OUTPUT
          echo "Version: $rawVersion"

      - name: Bump versions
        shell: pwsh
        run: pnpm -F "@vortex/main" -F "@nexusmods/vortex-api" version ${{ steps.version.outputs.RAW_VERSION }} --no-git-tag-version --no-git-checks --allow-same-version
        working-directory: vortex

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
        working-directory: vortex
        env:
          VORTEX_ELECTRON_REBUILD: "defer"

      - name: Cache Electron native build headers
        uses: actions/cache@v5
        with:
          path: |
            ~/.electron-gyp
            ~/.cache/node-gyp
          key: unlocked-native-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vortex/package.json', 'vortex/pnpm-lock.yaml', 'vortex/src/main/package.json') }}

      - name: Build workspace
        shell: pwsh
        run: pnpm run build
        working-directory: vortex
        env:
          NODE_ENV: production

      - name: Test unlocked download and collection paths
        shell: pwsh
        working-directory: vortex
        run: |
          pnpm -F @vortex/renderer exec vitest run src/IPCDownloadAdapter.existingFile.test.ts src/IPCDownloadAdapter.naming.test.ts src/extensions/collections/util/InstallDriver.test.ts src/extensions/mod_management/InstallManager.sharedDownloads.test.ts src/util/collectionInstallSession.stateMachine.test.ts
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Focused unlocked regression tests failed."
            exit 1
          }

      - name: Publish dist package
        shell: pwsh
        run: pnpm nx run @vortex/main:publish
        working-directory: vortex
        env:
          NODE_ENV: production
          VORTEX_ELECTRON_REBUILD: "skip"

      - name: Cache packaged Electron native rebuild outputs
        id: packaged-native-cache
        uses: actions/cache@v5
        with:
          path: |
            vortex/src/main/dist/node_modules/@nexusmods/fomod-installer-native/build
            vortex/src/main/dist/node_modules/@nexusmods/fomod-installer-native/bin
            vortex/src/main/dist/node_modules/drivelist/build
            vortex/src/main/dist/node_modules/drivelist/bin
            vortex/src/main/dist/node_modules/leveldown/build
            vortex/src/main/dist/node_modules/leveldown/bin
            vortex/src/main/dist/node_modules/winapi-bindings/build
            vortex/src/main/dist/node_modules/winapi-bindings/bin
            vortex/src/main/dist/node_modules/xxhash-addon/build
            vortex/src/main/dist/node_modules/xxhash-addon/bin
            vortex/src/main/dist/node_modules/@parcel/watcher/build
            vortex/src/main/dist/node_modules/@parcel/watcher/bin
          key: unlocked-dist-electron-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vortex/pnpm-lock.yaml', 'vortex/pnpm-workspace.yaml', 'vortex/src/main/package.json', 'vortex/src/main/postinstall.mjs') }}

      - name: Rebuild packaged Electron native modules
        if: steps.packaged-native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: vortex/src/main/dist
        run: npx electron-rebuild

      - name: Build installer (unsigned)
        shell: pwsh
        run: pnpm -F @vortex/main run package:nosign
        working-directory: vortex

      - name: Validate package creation
        shell: pwsh
        working-directory: vortex
        run: |
          $installerExists = Test-Path "./dist/vortex-unlocked-setup-*.exe"
          $latestYmlExists = Test-Path "./dist/latest.yml"
          if (-not $installerExists) {
            Write-Error "Installer executable not found in ./dist/"
            exit 1
          }
          if (-not $latestYmlExists) {
            Write-Error "latest.yml not found in ./dist/"
            exit 1
          }
          # Guards against the packager mangling nested dependency versions in
          # the asar (upstream script - identical check to official Vortex CI).
          node scripts/verify-packaged-asar.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "packaged asar does not match the deploy tree"
            exit 1
          }
          Write-Output "Package validation successful - installer, latest.yml and asar verified"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-unlocked-${{ steps.version.outputs.RAW_VERSION }}
          path: |
            vortex/dist/vortex-unlocked-setup-*.exe
            vortex/dist/vortex-unlocked-setup-*.exe.blockmap
            vortex/dist/latest.yml
          if-no-files-found: error

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.TAG_VERSION }}
          name: Vortex Unlocked ${{ steps.version.outputs.RAW_VERSION }}
          body: |
            Vortex Unlocked build

            - Upstream commit: ${{ env.UPSTREAM_SHA }} (Nexus-Mods/Vortex ${{ needs.plan.outputs.mode == 'pinned' && 'pinned base - latest master did not accept the patch yet' || 'master' }})
            - Patch: `patches/vortex-unlocked.patch`
            - Unlocked by [Chaython](https://github.com/Chaython)

            **What this build changes**
            - No premium upsell UI (banners, dashlets, dialogs, badges, membership status)
            - No client-side premium gates (parallel download threads, Update All, collection bulk-install, Health Check 1-click/Install All)
            - Parallel downloads on by default: 5 download threads out of the box (Settings -> Downloads -> "Download Threads", adjustable 1-10; the setting is now an upper bound and the downloader adapts effective concurrency to throughput/failures)
            - When Nexus returns multiple authorised download URLs, Vortex learns host reliability and spreads new transfers across healthier returned hosts
            - Interrupted downloads without a usable checkpoint are re-resolved and restarted under the same download ID instead of being discarded
            - Optional: fully hide the Dashboard tab via Settings -> Interface -> Customisation -> "Hide Dashboard tab"
            - Optional: auto-authorise refused download links through an embedded nexusmods.com website session (Settings -> Interface -> "Auto-authorise downloads via website session"); requests are serialized and paced, any failure falls back to the manual download dialog - downloads remain speed-limited by the account tier
            - On first start: option to import data (profiles, mods, settings, downloads) from an existing official Vortex install; also available later via Settings -> Interface -> "Import data from Vortex" (staging paths inside the data directory are rewritten to the new location; only Vortex' own data is copied - caches/logs are skipped; the import refuses to run while the official client is open; locked files outside the state database are skipped and reported instead of failing the import; existing data is backed up and restored on failure)
            - Keeps its data separate from official Vortex: %APPDATA%\vortex-unlocked (official Vortex uses %APPDATA%\Vortex), so both can run side by side
            - Uninstaller: removes the electron-updater cache (%LOCALAPPDATA%\vortex-unlocked-updater) and asks whether to also delete the application data; the upstream uninstall feedback survey was removed
            - Usage analytics / event reporting disabled
            - In-app auto-update: the client checks this repository's releases (on launch and every 4 hours, or via Settings -> Application -> "Check for updates") and can download and install the update on restart - updates only ever come from Chaython/Vortex-unlocked, never from upstream
            - Installs side-by-side with official Vortex as "Vortex Unlocked"
          artifacts: |
            vortex/dist/vortex-unlocked-setup-*.exe
            vortex/dist/vortex-unlocked-setup-*.exe.blockmap
            vortex/dist/latest.yml
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
